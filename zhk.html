<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM — Карточки ЖК Ташкента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0c0e14;
  --surface:   #141822;
  --surface-2: #1b2029;
  --border:    #262b3a;
  --border-2:  #343b50;
  --text:      #e9ebf2;
  --text-dim:  #8a90a8;
  --text-faint:#565c72;
  --high:      #ef5b4e;
  --high-soft: rgba(239,91,78,.12);
  --med:       #eba23c;
  --med-soft:  rgba(235,162,60,.12);
  --low:       #49b885;
  --low-soft:  rgba(73,184,133,.12);
  --accent:    #6f8cff;
  --accent-soft: rgba(111,140,255,.12);
  --font-ui:  'Manrope', sans-serif;
  --font-data:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:40;}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand-logo{font-size:19px;font-weight:800;letter-spacing:-.3px;color:#fff;}
.brand-logo .dot{color:var(--accent);}
.brand-tag{font-size:12px;color:var(--text-dim);font-weight:500;}
.header-stats{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.hstat{text-align:right;}
.hstat b{display:block;font-family:var(--font-data);font-size:16px;font-weight:600;line-height:1.2;}
.hstat span{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
.hstat b.hi{color:var(--high);} .hstat b.md{color:var(--med);} .hstat b.lo{color:var(--low);}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--low);animation:pulse 2s infinite;}
.live-dot.stale{background:var(--med);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* CONTROLS */
.controls{max-width:1240px;margin:0 auto;padding:18px 24px 6px;display:flex;flex-direction:column;gap:10px;}
.controls-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search{flex:1;min-width:220px;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:0 12px;font-size:13px;font-family:inherit;outline:none;}
.search:focus{border-color:var(--accent);}
select{height:36px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:0 10px;font-size:12px;font-family:inherit;outline:none;cursor:pointer;}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:11px;font-weight:600;cursor:pointer;color:var(--text-dim);transition:all .12s;}
.chip:hover{border-color:var(--border-2);color:var(--text);}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.chip.hi.active{background:var(--high);border-color:var(--high);color:#fff;}
.chip.md.active{background:var(--med);border-color:var(--med);color:#1a1a18;}
.chip.lo.active{background:var(--low);border-color:var(--low);color:#0c2418;}
.result-count{font-size:11px;color:var(--text-faint);margin-left:auto;}

/* GRID */
.grid{max-width:1240px;margin:0 auto;padding:12px 24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.empty{grid-column:1/-1;text-align:center;color:var(--text-faint);padding:60px 0;font-size:13px;}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s, transform .15s;}
.card:hover{border-color:var(--border-2);transform:translateY(-2px);}
.card-top{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.card-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-name{font-size:14.5px;font-weight:700;letter-spacing:-.2px;line-height:1.3;}
.risk-badge{flex-shrink:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.risk-badge.high{background:var(--high-soft);color:var(--high);}
.risk-badge.medium{background:var(--med-soft);color:var(--med);}
.risk-badge.low{background:var(--low-soft);color:var(--low);}
.card-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.tag{font-size:10.5px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;}

/* SLIDER */
.slider{position:relative;flex:1;}
.slides{overflow:hidden;}
.slides-track{display:flex;transition:transform .35s ease;}
.slide{min-width:100%;padding:14px 16px 12px;min-height:132px;}
.slide-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:9px;}
.slider-nav{display:flex;align-items:center;justify-content:center;gap:5px;padding:0 16px 12px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--border-2);border:none;cursor:pointer;padding:0;transition:all .15s;}
.dot.active{background:var(--accent);width:16px;border-radius:999px;}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
.card:hover .arrow{opacity:1;}
.arrow:hover{color:var(--text);border-color:var(--border-2);}
.arrow.prev{left:8px;} .arrow.next{right:8px;}

/* SLIDE CONTENT */
.big-metric{display:flex;align-items:baseline;gap:8px;}
.big-metric b{font-family:var(--font-data);font-size:26px;font-weight:600;line-height:1;}
.big-metric span{font-size:11px;color:var(--text-dim);}
.verdict{font-size:12px;font-weight:600;margin-top:6px;}
.meter{height:6px;border-radius:999px;background:var(--surface-2);margin-top:10px;overflow:hidden;}
.meter i{display:block;height:100%;border-radius:999px;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin-top:2px;}
.kv div span{display:block;font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.kv div b{font-family:var(--font-data);font-size:13px;font-weight:500;}
.kv div b.danger{color:var(--high);}
.dev-name{font-size:12.5px;font-weight:700;margin-bottom:2px;}
.rating-chip{display:inline-block;font-family:var(--font-data);font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px;}
.price-line{font-family:var(--font-data);font-size:22px;font-weight:600;}
.price-line small{font-size:11px;color:var(--text-dim);font-family:var(--font-ui);}
.slide .link{font-size:11.5px;display:inline-block;margin-top:8px;}
.muted{color:var(--text-faint);}

@media (max-width:640px){
  .header{padding:12px 16px;}
  .controls,.grid{padding-left:16px;padding-right:16px;}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo">CAM<span class="dot">.</span></div>
    <div class="brand-tag">Карточки ЖК · Ташкент</div>
  </div>
  <div class="header-stats">
    <div class="hstat"><b id="st-total">—</b><span>объектов</span></div>
    <div class="hstat"><b class="hi" id="st-high">—</b><span>высокий риск</span></div>
    <div class="hstat"><b class="md" id="st-med">—</b><span>умеренный</span></div>
    <div class="hstat"><b class="lo" id="st-low">—</b><span>надёжные</span></div>
    <div class="live"><span class="live-dot" id="live-dot"></span><span id="live-text">загрузка…</span></div>
  </div>
</header>

<div class="controls">
  <div class="controls-row">
    <input class="search" id="q" type="search" placeholder="Поиск по ЖК, застройщику, району…">
    <select id="district"><option value="all">Все районы</option></select>
    <select id="sort">
      <option value="score_desc">Сначала рискованные</option>
      <option value="score_asc">Сначала надёжные</option>
      <option value="price_asc">Цена ↑</option>
      <option value="price_desc">Цена ↓</option>
      <option value="delay_desc">Просрочка ↓</option>
    </select>
  </div>
  <div class="controls-row">
    <button class="chip active" data-f="risk" data-v="all">Все</button>
    <button class="chip hi" data-f="risk" data-v="high">Высокий риск</button>
    <button class="chip md" data-f="risk" data-v="medium">Умеренный</button>
    <button class="chip lo" data-f="risk" data-v="low">Надёжные</button>
    <button class="chip active" data-f="cls" data-v="all">Любой класс</button>
    <button class="chip" data-f="cls" data-v="Комфорт">Комфорт</button>
    <button class="chip" data-f="cls" data-v="Бизнес">Бизнес</button>
    <button class="chip" data-f="cls" data-v="Премиум">Премиум</button>
    <span class="result-count" id="count"></span>
  </div>
</div>

<main class="grid" id="grid"></main>

<script>
/* ── Данные загружаются динамически из data/objects.json.
     Обновили JSON → страница сама подхватит изменения (перезапрос каждые 60 с).
     При открытии без сервера (file://) используется data/objects.js. ── */
const DATA_URL = 'data/objects.json';
const POLL_MS = 60000;

const DISTRICT_MAP = {'Sergeli':'Сергелийский','Chilonzor':'Чиланзарский','Mirzo-Ulugbek':'Мирзо-Улугбекский',
  'Yashnobod':'Яшнабадский','Yakkasaroy':'Яккасарайский','Uchtepa':'Учтепинский','Olmozor':'Алмазарский',
  'Mirabad':'Мирабадский','Yunusobod':'Юнусабадский','Bektimir':'Бектемирский'};
const RATING_NAME = {'A':'Высший','B':'Хороший','BB':'Выше среднего','C':'Удовлетворительный','CC':'Средний','D':'Низкий','DD':'Очень низкий','DDD':'Критический'};
const RISK_LABEL = {high:'Высокий риск',medium:'Умеренный',low:'Надёжный'};
const RISK_COLOR = {high:'var(--high)',medium:'var(--med)',low:'var(--low)'};

let ALL = [];            // текущий датасет (только сопоставленные с domtut)
let dataStamp = null;    // отпечаток данных для детекции изменений
let lastFetch = null;
const state = {risk:'all', cls:'all', district:'all', q:'', sort:'score_desc'};
const sliderPos = {};    // cam_id -> индекс слайда (переживает перерисовку)
let autoTimer = null;

/* ── Загрузка данных ── */
async function loadData(initial) {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error(res.status);
    const payload = await res.json();
    applyData(payload, initial);
  } catch (e) {
    if (initial) {
      // file:// или сбой сети — фолбэк на data/objects.js
      const s = document.createElement('script');
      s.src = 'data/objects.js';
      s.onload = () => applyData(window.CAM_DATA, true);
      s.onerror = () => setLive(false, 'нет данных');
      document.head.appendChild(s);
    } else {
      setLive(false, 'нет связи, показаны старые данные');
    }
  }
}

function applyData(payload, initial) {
  lastFetch = new Date();
  const stamp = (payload.updated_at || '') + ':' + (payload.count || payload.objects.length);
  const changed = stamp !== dataStamp;
  dataStamp = stamp;
  if (changed || initial) {
    ALL = payload.objects.filter(d => d.matched);
    if (initial) populateDistricts();
    render();
  }
  setLive(true, 'данные от ' + (payload.updated_at || '—'));
}

function setLive(ok, text) {
  document.getElementById('live-dot').classList.toggle('stale', !ok);
  document.getElementById('live-text').textContent = text;
}

/* ── Фильтрация ── */
function filtered() {
  const q = state.q.toLowerCase().trim();
  let items = ALL.filter(d =>
    (state.risk === 'all' || d.risk === state.risk) &&
    (state.cls === 'all' || d.housing_class === state.cls) &&
    (state.district === 'all' || d.district === state.district) &&
    (!q || [d.name, d.dev_comm, d.dev_legal, DISTRICT_MAP[d.district] || d.district]
      .some(v => v && String(v).toLowerCase().includes(q)))
  );
  const s = state.sort;
  items.sort((a, b) =>
    s === 'score_desc' ? b.cam_score - a.cam_score :
    s === 'score_asc'  ? a.cam_score - b.cam_score :
    s === 'price_asc'  ? (a.price_usd || 1e9) - (b.price_usd || 1e9) :
    s === 'price_desc' ? (b.price_usd || 0) - (a.price_usd || 0) :
                         (b.delay_days || 0) - (a.delay_days || 0));
  return items;
}

/* ── Слайды карточки ── */
function slidesFor(d) {
  const clr = RISK_COLOR[d.risk];
  const scorePct = Math.min(100, Math.max(0, d.cam_score));
  const s1 = `
    <div class="slide-label">Оценка риска CAM</div>
    <div class="big-metric"><b style="color:${clr}">${d.cam_score}</b><span>из 100 · ${RISK_LABEL[d.risk]}</span></div>
    <div class="verdict" style="color:${clr}">${d.verdict || ''}</div>
    <div class="meter"><i style="width:${scorePct}%;background:${clr}"></i></div>
    ${d.delay_days > 0 ? `<div class="kv" style="margin-top:10px"><div><span>Просрочка</span><b class="danger">+${d.delay_days} дн</b></div><div><span>Срок сдачи</span><b>${d.deadline || '—'}</b></div></div>` : ''}`;

  const prog = d.progress_pct != null ? Math.round(d.progress_pct) : null;
  const s2 = `
    <div class="slide-label">Ход строительства</div>
    <div class="big-metric"><b>${prog != null ? prog + '%' : '—'}</b><span>готовность корпусов</span></div>
    <div class="meter"><i style="width:${prog || 0}%;background:var(--accent)"></i></div>
    <div class="kv" style="margin-top:10px">
      <div><span>Корпуса</span><b>${d.blocks_done}/${d.blocks_total}</b></div>
      <div><span>Этажность</span><b>${d.floors || '—'}</b></div>
      <div><span>Квартир</span><b>${d.apts ? d.apts.toLocaleString('ru') : '—'}</b></div>
      <div><span>Срок сдачи</span><b>${d.deadline || '—'}</b></div>
    </div>`;

  const rat = d.dev_rating ? `<span class="rating-chip">${d.dev_rating}${RATING_NAME[d.dev_rating] ? ' · ' + RATING_NAME[d.dev_rating] : ''}</span>` : '';
  const s3 = `
    <div class="slide-label">Застройщик</div>
    <div class="dev-name">${d.dev_comm || d.dev_legal || '—'}</div>
    ${rat}
    <div class="kv">
      <div><span>Опыт</span><b>${d.dev_age_yrs != null ? d.dev_age_yrs + ' лет' : '—'}</b></div>
      <div><span>Объектов</span><b>${d.dev_objs ?? '—'}</b></div>
      <div><span>Просрочено</span><b class="${d.dev_ovrd >= 50 ? 'danger' : ''}">${d.dev_ovrd != null ? d.dev_ovrd + '%' : '—'}</b></div>
      <div><span>ИНН</span><b>${d.dev_inn || '—'}</b></div>
    </div>`;

  const s4 = `
    <div class="slide-label">Цена и предложение</div>
    <div class="price-line">${d.price_usd ? '$' + d.price_usd.toLocaleString('ru') : '<span class="muted">нет данных</span>'} ${d.price_usd ? '<small>/ м²</small>' : ''}</div>
    <div class="kv" style="margin-top:10px">
      <div><span>Класс</span><b>${d.housing_class || '—'}</b></div>
      <div><span>Район</span><b>${DISTRICT_MAP[d.district] || d.district || '—'}</b></div>
      <div><span>Ипотека</span><b>${d.has_mortgage ? 'да' : 'нет'}</b></div>
      <div><span>Разрешение</span><b>${d.has_permit ? 'есть' : 'нет'}</b></div>
    </div>
    ${d.domtut_url ? `<a class="link" href="${d.domtut_url}" target="_blank" rel="noopener">Страница на domtut.uz →</a>` : ''}`;

  return [s1, s2, s3, s4];
}

/* ── Рендер ── */
function render() {
  const items = filtered();
  updateStats();
  document.getElementById('count').textContent = items.length + ' из ' + ALL.length;
  const grid = document.getElementById('grid');
  if (!items.length) { grid.innerHTML = '<div class="empty">Ничего не найдено — измените фильтры</div>'; return; }
  grid.innerHTML = items.map(d => {
    const slides = slidesFor(d);
    const pos = sliderPos[d.cam_id] || 0;
    const clsTag = d.housing_class ? `<span class="tag">${d.housing_class}</span>` : '';
    const distTag = d.district ? `<span class="tag">${DISTRICT_MAP[d.district] || d.district}</span>` : '';
    return `
    <article class="card" data-id="${d.cam_id}">
      <div class="card-top">
        <div class="card-title-row">
          <div class="card-name">${d.name}</div>
          <span class="risk-badge ${d.risk}">${RISK_LABEL[d.risk]}</span>
        </div>
        <div class="card-tags">${clsTag}${distTag}${d.delay_days > 0 ? `<span class="tag" style="color:var(--high)">+${d.delay_days} дн</span>` : ''}</div>
      </div>
      <div class="slider">
        <div class="slides"><div class="slides-track" style="transform:translateX(-${pos * 100}%)">
          ${slides.map(s => `<div class="slide">${s}</div>`).join('')}
        </div></div>
        <button class="arrow prev" data-dir="-1" aria-label="Назад">‹</button>
        <button class="arrow next" data-dir="1" aria-label="Вперёд">›</button>
        <div class="slider-nav">${slides.map((_, i) => `<button class="dot${i === pos ? ' active' : ''}" data-slide="${i}" aria-label="Слайд ${i + 1}"></button>`).join('')}</div>
      </div>
    </article>`;
  }).join('');
}

function updateStats() {
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('st-total', ALL.length);
  set('st-high', ALL.filter(d => d.risk === 'high').length);
  set('st-med', ALL.filter(d => d.risk === 'medium').length);
  set('st-low', ALL.filter(d => d.risk === 'low').length);
}

function populateDistricts() {
  const sel = document.getElementById('district');
  sel.length = 1;
  [...new Set(ALL.map(d => d.district).filter(Boolean))].sort()
    .forEach(d => sel.add(new Option(DISTRICT_MAP[d] || d, d)));
}

/* ── Управление слайдером ── */
function setSlide(card, idx) {
  const dots = card.querySelectorAll('.dot');
  const n = dots.length;
  idx = ((idx % n) + n) % n;
  sliderPos[card.dataset.id] = idx;
  card.querySelector('.slides-track').style.transform = `translateX(-${idx * 100}%)`;
  dots.forEach((dot, i) => dot.classList.toggle('active', i === idx));
}

document.getElementById('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const cur = sliderPos[card.dataset.id] || 0;
  if (e.target.matches('.dot')) setSlide(card, +e.target.dataset.slide);
  else if (e.target.matches('.arrow')) setSlide(card, cur + (+e.target.dataset.dir));
});

/* Автопрокрутка: раз в 5 с двигает слайды у карточек, на которые не наведён курсор */
function startAuto() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    document.querySelectorAll('.card:not(:hover)').forEach(card => {
      setSlide(card, (sliderPos[card.dataset.id] || 0) + 1);
    });
  }, 5000);
}

/* ── Фильтры ── */
document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
  const f = btn.dataset.f;
  document.querySelectorAll(`.chip[data-f="${f}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state[f] = btn.dataset.v;
  render();
}));
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
document.getElementById('district').addEventListener('change', e => { state.district = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

/* ── Старт ── */
loadData(true);
setInterval(() => loadData(false), POLL_MS);
startAuto();
</script>
</body>
</html>
