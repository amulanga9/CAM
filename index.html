<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM — Риски новостроек Ташкента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0c0e14;
  --surface:   #141822;
  --surface-2: #1b2029;
  --border:    #262b3a;
  --border-2:  #343b50;
  --text:      #e9ebf2;
  --text-dim:  #8a90a8;
  --text-faint:#565c72;

  --high:      #ef5b4e;
  --high-soft: rgba(239,91,78,.12);
  --med:       #eba23c;
  --med-soft:  rgba(235,162,60,.12);
  --low:       #49b885;
  --low-soft:  rgba(73,184,133,.12);
  --accent:    #6f8cff;
  --accent-soft: rgba(111,140,255,.12);

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  --r-sm: 6px; --r-md: 9px; --r-lg: 13px; --r-pill: 999px;

  --font-ui:   'Manrope', sans-serif;
  --font-data: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-ui); font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.v a { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; }
.v a:hover { color: var(--accent); }

/* HEADER */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-5) var(--sp-6);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--sp-6); flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: var(--sp-3); }
.brand-logo { font-size: 19px; font-weight: 800; letter-spacing: -.3px; color: #fff; }
.brand-logo .dot { color: var(--accent); }
.brand-tag { font-size: 12px; color: var(--text-dim); font-weight: 500; }

.header-meta { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
.meta-line { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: var(--sp-2); }
.meta-line b { font-family: var(--font-data); color: var(--text); font-weight: 600; }
.meta-line .danger { font-family: var(--font-data); color: var(--high); font-weight: 600; }

.riskbar-wrap { display: flex; align-items: center; gap: var(--sp-3); }
.riskbar { display: flex; width: 160px; height: 7px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-2); }
.riskbar span { height: 100%; }
.riskbar .seg-high { background: var(--high); }
.riskbar .seg-med  { background: var(--med); }
.riskbar .seg-low  { background: var(--low); }
.riskbar-legend { display: flex; gap: var(--sp-3); font-size: 11px; color: var(--text-dim); }
.riskbar-legend b { font-family: var(--font-data); }
.lg-high b { color: var(--high); }
.lg-med  b { color: var(--med); }
.lg-low  b { color: var(--low); }

/* LANG SWITCH */
.lang-switch { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; }
.lang-btn {
  background: transparent; border: none; color: var(--text-dim); cursor: pointer;
  font: 700 11px var(--font-data); letter-spacing: .5px; padding: 5px 11px; border-radius: var(--r-sm);
  transition: all .15s;
}
.lang-btn.active { background: var(--accent); color: #fff; }
.lang-btn:not(.active):hover { color: var(--text); }

/* FILTER BAR */
.filterbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: var(--sp-3) var(--sp-6);
  display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap;
}
.filter-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 14px; border-radius: var(--r-sm); cursor: pointer;
  font: 500 12px var(--font-ui); transition: all .15s;
}
.filter-btn:hover { border-color: var(--border-2); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-select {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 10px; border-radius: var(--r-sm); cursor: pointer;
  font: 500 12px var(--font-ui); transition: all .15s; outline: none;
}
.filter-select:hover, .filter-select:focus { border-color: var(--border-2); color: var(--text); }
.search {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 13px; border-radius: var(--r-sm); font: 500 12px var(--font-ui);
  width: 220px; outline: none; transition: border-color .15s;
}
.search::placeholder { color: var(--text-faint); }
.search:focus { border-color: var(--accent); }
.version-pill {
  margin-left: auto; font: 600 11px var(--font-data); color: var(--text-dim);
  background: var(--surface-2); padding: 6px 13px; border-radius: var(--r-sm); border: 1px solid var(--border);
}

/* SECTIONS */
.section { padding: var(--sp-6) var(--sp-6) 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--sp-3); }
.section-head h2 { font-size: 13px; font-weight: 700; }
.section-head .sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-data); }

/* SCATTER */
#scatter { width: 100%; height: 240px; display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); }
#scatter-tooltip {
  position: fixed; background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); font-size: 11px;
  pointer-events: none; display: none; z-index: 100; max-width: 220px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
#scatter-tooltip b { font-size: 12px; }

/* CARDS GRID */
.cards-grid { padding: var(--sp-4) var(--sp-6) var(--sp-10); display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: var(--sp-4); }

.pagination {
  display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
  padding: 0 var(--sp-6) var(--sp-10);
}
.page-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 7px 16px; border-radius: var(--r-sm); cursor: pointer;
  font: 600 12px var(--font-ui); transition: all .15s;
}
.page-btn:hover:not(:disabled) { border-color: var(--border-2); color: var(--text); }
.page-btn:disabled { opacity: .35; cursor: default; }
.page-indicator {
  font: 600 12px var(--font-data); color: var(--text-dim);
  min-width: 64px; text-align: center;
}
.page-indicator b { color: var(--text); }
.page-jump {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  width: 44px; padding: 6px 4px; border-radius: var(--r-sm); font: 600 12px var(--font-data);
  text-align: center; outline: none; transition: border-color .15s;
}
.page-jump:focus { border-color: var(--accent); }


.cards-grid.single-view { grid-template-columns: 1fr; }
.cards-grid.single-view .card:not(.expanded) { display: none; }

.empty { text-align: center; padding: var(--sp-10) var(--sp-6); color: var(--text-dim); }

/* CARD */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); border-top: 3px solid var(--border); overflow: hidden; transition: border-color .15s; cursor: pointer; }
.card:hover { border-color: var(--border-2); }
.card.risk-high { border-top-color: var(--high); }
.card.risk-medium { border-top-color: var(--med); }
.card.risk-low { border-top-color: var(--low); }

.card-header { padding: var(--sp-4); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
.card-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
.card-sub { font-size: 11px; color: var(--text-dim); margin-top: 3px; }

.risk-badge { flex-shrink: 0; text-align: right; }
.risk-pill { font: 700 10px var(--font-ui); letter-spacing: .4px; text-transform: uppercase; padding: 4px 10px; border-radius: var(--r-sm); display: inline-block; }
.risk-pill.high   { color: var(--high); background: var(--high-soft); }
.risk-pill.medium { color: var(--med);  background: var(--med-soft); }
.risk-pill.low    { color: var(--low);  background: var(--low-soft); }
.risk-verdict { font-size: 11px; color: var(--text-dim); margin-top: 5px; max-width: 140px; }

.card-flags { padding: 0 var(--sp-4) var(--sp-4); display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.flag { font: 500 11px var(--font-ui); padding: 4px 9px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.flag .v { font-family: var(--font-data); font-weight: 600; }
.flag-red  { background: var(--high-soft); color: var(--high); }
.flag-amb  { background: var(--med-soft);  color: var(--med); }
.flag-grn  { background: var(--low-soft);  color: var(--low); }
.flag-neu  { background: var(--surface-2); color: var(--text-dim); }

.divider { height: 1px; background: var(--border); margin: 0 var(--sp-4); }

/* TEASER */
.teaser { padding: var(--sp-4); }
.teaser-list { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.teaser-item { display: flex; align-items: center; gap: var(--sp-2); font-size: 12px; color: var(--text-faint); }
.teaser-item .lock { font-size: 12px; opacity: .7; }
.btn-buy { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--r-sm); padding: 10px; font: 700 12px var(--font-ui); cursor: pointer; transition: opacity .15s; }
.btn-buy:hover { opacity: .9; }
.btn-pack { width: 100%; margin-top: var(--sp-2); background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px; font: 600 11px var(--font-ui); cursor: pointer; transition: all .15s; }
.btn-pack:hover { border-color: var(--border-2); color: var(--text); }

/* EXPANDED */
.card.expanded .teaser { display: none; }
.card-full { display: none; padding: 0 var(--sp-4) var(--sp-4); }
.card.expanded .card-full { display: block; }

.full-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-top: var(--sp-3); }
.full-wide { grid-column: 1 / -1; }

.box { background: var(--surface-2); border-radius: var(--r-md); padding: var(--sp-3); }
.box h4 { font: 700 10px var(--font-ui); color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; margin-bottom: var(--sp-2); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); font-size: 12px; margin-bottom: 4px; }
.row .l { color: var(--text-dim); }
.row .v { font-family: var(--font-data); font-weight: 500; text-align: right; }
.row .v.bad  { color: var(--high); }
.row .v.warn { color: var(--med); }
.row .v.good { color: var(--low); }
.row .v.txt  { font-family: var(--font-ui); font-weight: 600; max-width: 60%; }

.src-btn { display: inline-flex; align-items: center; gap: 5px; font: 500 10px var(--font-ui); color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 5px 10px; text-decoration: none; margin-top: var(--sp-2); transition: all .15s; }
.src-btn:hover { border-color: var(--accent); color: var(--accent); }

.progress-track { height: 6px; background: var(--surface); border-radius: var(--r-pill); overflow: hidden; margin: 6px 0 var(--sp-2); }
.progress-fill { height: 100%; border-radius: var(--r-pill); }

/* RECOMMENDATIONS */
.rec-box { background: var(--surface-2); border-radius: var(--r-md); border-left: 3px solid var(--accent); padding: var(--sp-3) var(--sp-4); }
.rec-box h4 { font: 700 10px var(--font-ui); color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; margin-bottom: var(--sp-2); }
.rec-list { display: flex; flex-direction: column; gap: 6px; }
.rec-item { display: flex; gap: var(--sp-2); font-size: 12px; line-height: 1.5; }
.rec-item .ic { flex-shrink: 0; }
.rec-divider { height: 1px; background: var(--border); margin: var(--sp-3) 0; }
.contract-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.contract-col { font-size: 12px; line-height: 1.55; }
.contract-col .ct-title { display: block; font-weight: 700; margin-bottom: 4px; font-size: 12px; }
.contract-col.good .ct-title { color: var(--low); }
.contract-col.bad  .ct-title { color: var(--high); }
.checklist-title { font: 700 10px var(--font-ui); color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
.checklist { font-size: 12px; line-height: 1.7; color: var(--text); }
.checklist li { margin-left: 16px; }

.scatter-wrap { position: relative; }
.info-icon {
  position: absolute; top: var(--sp-2); right: var(--sp-2); z-index: 5;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim); font: 700 11px var(--font-data);
  display: flex; align-items: center; justify-content: center;
  cursor: default; transition: all .15s;
}
.info-icon:hover { border-color: var(--accent); color: var(--accent); }
.info-tooltip {
  position: absolute; top: 28px; right: 0; z-index: 6;
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3);
  font-size: 11px; color: var(--text-dim); white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .15s;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.info-icon:hover + .info-tooltip { opacity: 1; }

.dossier-tag {
  font: 500 10px var(--font-data); color: var(--text-faint);
  letter-spacing: .3px; margin-top: 6px; display: flex; align-items: center; gap: 6px;
}
.dossier-tag .sep { opacity: .4; }

.coverage-wrap { display: flex; align-items: center; gap: var(--sp-2); margin-top: 6px; }
.coverage-track { flex: 1; height: 3px; background: var(--surface); border-radius: 2px; overflow: hidden; }
.coverage-fill { height: 100%; background: var(--text-faint); border-radius: 2px; }
.coverage-label { font: 500 10px var(--font-data); color: var(--text-faint); white-space: nowrap; }

.box h4 .num { color: var(--text-faint); font-family: var(--font-data); font-weight: 500; margin-right: 5px; }

.sources-foot { grid-column: 1/-1; padding-top: var(--sp-2); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
.sources-foot a { font: 500 10px var(--font-data); color: var(--text-faint); text-decoration: none; transition: color .15s; }
.sources-foot a:hover { color: var(--accent); }
.sources-foot .fn { color: var(--text-dim); margin-right: 3px; }


/* EXPAND TOGGLE */
.expand-hint { text-align: center; padding: var(--sp-2) 0; font: 600 11px var(--font-ui); color: var(--text-faint); border-top: 1px solid var(--border); }
.card.expanded .expand-hint .txt-open  { display: none; }
.card:not(.expanded) .expand-hint .txt-close { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-logo">CAM<span class="dot">·</span>UZ</span>
    <span class="brand-tag" id="t-brand-tag">—</span>
  </div>
  <div class="header-meta">
    <span class="meta-line"><b id="total-count">—</b><span id="t-meta-objects">—</span></span>
    <span class="meta-line"><span class="danger" id="overdue-count">—</span><span id="t-meta-overdue">—</span></span>
    <div class="riskbar-wrap">
      <div class="riskbar">
        <span class="seg-high" id="seg-high"></span>
        <span class="seg-med"  id="seg-med"></span>
        <span class="seg-low"  id="seg-low"></span>
      </div>
      <div class="riskbar-legend">
        <span class="lg-high"><b id="lg-high">—</b> <span id="t-lg-high">—</span></span>
        <span class="lg-med"><b id="lg-med">—</b> <span id="t-lg-med">—</span></span>
        <span class="lg-low"><b id="lg-low">—</b> <span id="t-lg-low">—</span></span>
      </div>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="ru" onclick="setLang('ru',this)">RU</button>
      <button class="lang-btn" data-lang="uz" onclick="setLang('uz',this)">UZ</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en',this)">EN</button>
    </div>
  </div>
</div>

<div class="filterbar">
  <select class="filter-select" id="filter-risk" onchange="onFilterChange()"></select>
  <select class="filter-select" id="filter-class" onchange="onFilterChange()"></select>
  <select class="filter-select" id="filter-district" onchange="onFilterChange()"></select>
  <input class="search" type="text" id="search-input" oninput="onSearch(this.value)">
  <span class="version-pill" id="t-version">—</span>
</div>

<div class="section">
  <div class="section-head">
    <h2 id="t-scatter-title">—</h2>
  </div>
  <div class="scatter-wrap">
    <canvas id="scatter"></canvas>
    <div class="info-icon">i</div>
    <div class="info-tooltip"><span id="scatter-count">—</span> <span id="t-scatter-sub">—</span></div>
    <div id="scatter-tooltip"></div>
  </div>
</div>

<div class="section">
  <div class="section-head">
    <h2 id="t-objects-title">—</h2>
    <span class="sub" id="showing-count"></span>
  </div>
</div>

<div class="cards-grid" id="cards"></div>
<div class="pagination" id="pagination">
  <button class="page-btn" id="page-prev" onclick="changePage(-1)">—</button>
  <div class="page-indicator">
    <input class="page-jump" id="page-jump" type="text" inputmode="numeric" onchange="jumpPage(this.value)">
    <span id="page-of-label"> / <b id="page-total">—</b></span>
  </div>
  <button class="page-btn" id="page-next" onclick="changePage(1)">—</button>
</div>
<div class="empty" id="empty" style="display:none"></div>

function ratingScore(rt) {
  const m = {'AAA':9,'AA':8,'A':7,'BBB':6,'BB':5,'B':4,'CCC':3,'CC':2,'C':1,'DDD':-1,'DD':-2,'D':-3};
  return m[rt] ?? 0;
}
function ratingClass(rt) {
  if(!rt) return '';
  const v = ratingScore(rt);
  return v>=6?'good':v>=3?'':'bad';
}

function riskPill(r) {
  const labels = {high:t('risk_high'), medium:t('risk_medium'), low:t('risk_low')};
  return `<span class="risk-pill ${r}">${labels[r]||''}</span>`;
}
function verdictText(r) {
  return {high:t('verdict_high'), medium:t('verdict_medium'), low:t('verdict_low')}[r] || '';
}

function buildFlags(d) {
  const flags = [];
  if(d.delay_days>0) flags.push(`<span class="flag flag-red">${t('flag_delay', d.delay_days)}</span>`);
  if(d.dev_rating && ['D','DD','DDD'].includes(d.dev_rating)) flags.push(`<span class="flag flag-red">${t('flag_dev_rating', d.dev_rating)}</span>`);
  if(d.pod_rating && ['D','DD','DDD'].includes(d.pod_rating)) flags.push(`<span class="flag flag-amb">${t('flag_pod_rating', d.pod_rating)}</span>`);
  if(d.affil_size>2) flags.push(`<span class="flag flag-neu">${t('flag_holding', d.affil_size)}</span>`);
  if(d.closed) flags.push(`<span class="flag flag-red">${t('flag_closed')}</span>`);
  flags.push(`<span class="flag flag-neu">${t('flag_blocks', d.blocks_done, d.blocks_total)}</span>`);
  if(d.price_usd) flags.push(`<span class="flag flag-neu">${t('flag_price', d.price_usd)}</span>`);
  return flags.join('');
}


function computeCoverage(d) {
  const fields = [
    d.dev_legal, d.dev_inn, d.dev_rating, d.dev_built!==null, d.dev_bad!==null,
    d.pod_legal, d.pod_inn, d.pod_rating, d.pod_built!==null, d.pod_bad!==null,
    d.price_usd, d.deadline, d.blocks_total>0, d.apts>0, d.floors>0,
    d.holding,
  ];
  const total = fields.length;
  const known = fields.filter(v=>v!==null && v!==undefined && v!=='').length;
  return {n: known, total};
}

function buildSourcesFoot(d) {
  const items = [];
  if (d.domtut_url) items.push(`<a href="${d.domtut_url}" target="_blank">domtut.uz</a>`);
  if (d.immo_url)   items.push(`<a href="${d.immo_url}" target="_blank">immo.uz</a>`);
  items.push(`<a href="${SHAFFOF_URL}" target="_blank">Shaffof</a>`);
  if (d.dev_inn) items.push(`<a href="${reytingUrl(d.dev_inn)}" target="_blank">reyting.mc.uz</a>`);
  if (d.dev_inn) items.push(`<a href="${orginfoUrl(d.dev_inn)}" target="_blank">orginfo.uz</a>`);
  return `<div class="sources-foot"><span class="fn">${t('sources_title')}:</span>${items.join('')}</div>`;
}

    if (d.affil_size > 2) recs.push({ic:'🔗', txt:t('rec_holding', d.affil_size)});
    if (bp < 30) recs.push({ic:'🏗', txt:t('rec_blocks')});
  } else if (d.risk === 'medium') {
    recs.push({ic:'📋', txt:t('rec_medium_schedule')});
    if (d.dev_rating && !['AAA','AA','A'].includes(d.dev_rating)) recs.push({ic:'⭐', txt:t('rec_medium_rating')});

  return `

function goToCard(id) {
  const data = filtered();
  const idx = data.findIndex(d=>d.id===id);
  if(idx<0) return;
  const targetPage = Math.floor(idx/PAGE_SIZE)+1;
  const needsRerender = targetPage !== currentPage;
  if(needsRerender) { currentPage = targetPage; render(); }

  const focusEl = () => {
    const el = document.getElementById('card-'+id);
    if(!el) return;
    if(!el.classList.contains('expanded')) el.classList.add('expanded');
    updateGridMode();
    el.scrollIntoView({behavior:'smooth', block:'center'});
    el.style.outline = '2px solid var(--accent)';
    el.style.outlineOffset = '2px';
    setTimeout(()=>{ el.style.outline=''; el.style.outlineOffset=''; }, 1400);
  };
  if(needsRerender) setTimeout(focusEl, 50); else focusEl();
}


function updateGridMode() {
  const grid = document.getElementById('cards');
  const anyExpanded = grid.querySelector('.card.expanded');
  grid.classList.toggle('single-view', !!anyExpanded);
  if(anyExpanded) anyExpanded.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleCard(id) {
  document.getElementById('card-'+id).classList.toggle('expanded');
  updateGridMode();
}

function filtered() {
  return DATA.filter(d => {
    if(filterRisk!=='all' && d.risk!==filterRisk) return false;
    if(filterClass!=='all' && d.housing_class!==filterClass) return false;
    if(filterDistrict!=='all' && d.district!==filterDistrict) return false;
    if(searchQ) {
      const q = searchQ.toLowerCase();
      if(!d.name.toLowerCase().includes(q) && !d.dev_legal.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const data = filtered();
  const grid = document.getElementById('cards');
  const empty = document.getElementById('empty');
  const pagination = document.getElementById('pagination');
  document.getElementById('showing-count').textContent = t('showing', data.length, DATA.length);

  if(!data.length) {
    grid.innerHTML=''; empty.style.display='block'; empty.textContent = t('empty');
    pagination.style.display = 'none';
    drawScatter(data);
    return;
  }
  empty.style.display = 'none';

  const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const start = (currentPage-1)*PAGE_SIZE;
  const pageData = data.slice(start, start+PAGE_SIZE);

  grid.innerHTML = pageData.map(buildCard).join('');
  drawScatter(data);

  pagination.style.display = totalPages > 1 ? 'flex' : 'none';
  document.getElementById('page-prev').disabled = currentPage <= 1;
  document.getElementById('page-next').disabled = currentPage >= totalPages;
  document.getElementById('page-prev').textContent = t('page_prev');
  document.getElementById('page-next').textContent = t('page_next');
  document.getElementById('page-jump').value = currentPage;
  document.getElementById('page-total').textContent = totalPages;
}

function changePage(delta) {
  currentPage += delta;
  render();
  document.getElementById('cards').scrollIntoView({behavior:'smooth', block:'start'});
}

function jumpPage(val) {
  const n = parseInt(val, 10);
  if(!isNaN(n)) currentPage = n;
  render();
}

/* ================= SCATTER ================= */
function drawScatter(data) {
  const c = document.getElementById('scatter');
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = c.offsetWidth * dpr;
  c.height = c.offsetHeight * dpr;
  ctx.scale(dpr, dpr);
  const W = c.offsetWidth, H = c.offsetHeight;
  const PAD = {l:46,r:18,t:14,b:32};

  ctx.clearRect(0,0,W,H);

  const pts = data.filter(d=>d.price_usd && d.cam_score);
  document.getElementById('scatter-count').textContent = pts.length;
  if(!pts.length) return;

  const maxP = Math.max(...pts.map(d=>d.price_usd));
  const minP = Math.min(...pts.map(d=>d.price_usd));

  const plotW = W-PAD.l-PAD.r, plotH = H-PAD.t-PAD.b;

  const yHigh = PAD.t + plotH*(1-70/100);
  const yLow  = PAD.t + plotH*(1-40/100);
  ctx.fillStyle = 'rgba(239,91,78,.05)';
  ctx.fillRect(PAD.l, PAD.t, plotW, yHigh-PAD.t);
  ctx.fillStyle = 'rgba(73,184,133,.05)';
  ctx.fillRect(PAD.l, yLow, plotW, H-PAD.b-yLow);

  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.font = '10px "IBM Plex Mono"';
  [25,50,75,100].forEach(pct=>{
    const y = PAD.t + plotH*(1-pct/100);
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    ctx.fillText(pct, 6, y+3);
  });

  const colors = {high:'#ef5b4e', medium:'#eba23c', low:'#49b885'};
  window._scatterPts = pts.map(d=>{
    const x = PAD.l + (d.price_usd-minP)/(maxP-minP||1)*plotW;
    const y = PAD.t + plotH*(1-d.cam_score/100);
    ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2);
    ctx.fillStyle = colors[d.risk]||'#888';
    ctx.globalAlpha = .85; ctx.fill(); ctx.globalAlpha = 1;
    return {x,y,d};
  });

  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '10px "IBM Plex Mono"'; ctx.textAlign='center';
  [minP, Math.round((minP+maxP)/2), maxP].forEach(v=>{
    const x = PAD.l + (v-minP)/(maxP-minP||1)*plotW;
    ctx.fillText('$'+v.toLocaleString(), x, H-PAD.b+16);
  });
  ctx.textAlign='left';
}

const tooltip = document.getElementById('scatter-tooltip');
const scatterEl = document.getElementById('scatter');
scatterEl.addEventListener('mousemove', e=>{
  if(!window._scatterPts) return;
  const rect = e.target.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const hit = window._scatterPts.find(p=>Math.hypot(p.x-mx,p.y-my)<8);
  if(hit) {
    scatterEl.style.cursor = 'pointer';
    tooltip.style.display='block';
    tooltip.style.left=(e.clientX+12)+'px';
    tooltip.style.top=(e.clientY-12)+'px';
    const lbl = {high:t('risk_high'), medium:t('risk_medium'), low:t('risk_low')}[hit.d.risk];
    tooltip.innerHTML = `<b>${hit.d.name}</b><br>${lbl} — ${verdictText(hit.d.risk)}<br>$${hit.d.price_usd.toLocaleString()}/m²`;
  } else {
    scatterEl.style.cursor = 'default';
    tooltip.style.display='none';
  }
});
scatterEl.addEventListener('mouseleave',()=>{tooltip.style.display='none'; scatterEl.style.cursor='default';});
scatterEl.addEventListener('click', e=>{
  if(!window._scatterPts) return;
  const rect = e.target.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const hit = window._scatterPts.find(p=>Math.hypot(p.x-mx,p.y-my)<8);
  if(hit) goToCard(hit.d.id);
});
window.addEventListener('resize', ()=>drawScatter(filtered()));

/* ================= INIT ================= */
const H_ = DATA.filter(d=>d.risk==='high').length;
const M_ = DATA.filter(d=>d.risk==='medium').length;
const L_ = DATA.filter(d=>d.risk==='low').length;
const OV_ = DATA.filter(d=>d.delay_days>0).length;
document.getElementById('total-count').textContent = DATA.length;
document.getElementById('overdue-count').textContent = OV_;
document.getElementById('lg-high').textContent = H_;
document.getElementById('lg-med').textContent  = M_;
document.getElementById('lg-low').textContent  = L_;
document.getElementById('seg-high').style.width = (H_/DATA.length*100)+'%';
document.getElementById('seg-med').style.width  = (M_/DATA.length*100)+'%';
document.getElementById('seg-low').style.width  = (L_/DATA.length*100)+'%';

applyStaticI18n();
render();
</script>
