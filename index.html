<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM — Риски новостроек Ташкента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root {
  --bg:        #0c0e14;
  --surface:   #141822;
  --surface-2: #1b2029;
  --border:    #262b3a;
  --border-2:  #343b50;
  --text:      #e9ebf2;
  --text-dim:  #8a90a8;
  --text-faint:#565c72;
  --high:      #ef5b4e;
  --high-soft: rgba(239,91,78,.12);
  --med:       #eba23c;
  --med-soft:  rgba(235,162,60,.12);
  --low:       #49b885;
  --low-soft:  rgba(73,184,133,.12);
  --accent:    #6f8cff;
  --accent-soft: rgba(111,140,255,.12);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:6px; --r-md:9px; --r-lg:13px; --r-pill:999px;
  --font-ui:  'Manrope', sans-serif;
  --font-data:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:var(--sp-4) var(--sp-6);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:var(--sp-3);}
.brand-logo{font-size:19px;font-weight:800;letter-spacing:-.3px;color:#fff;}
.brand-logo .dot{color:var(--accent);}
.brand-tag{font-size:12px;color:var(--text-dim);font-weight:500;}
.header-meta{display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap;}
.meta-line{font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:var(--sp-2);}
.meta-line b{font-family:var(--font-data);color:var(--text);font-weight:600;}
.meta-line .danger{font-family:var(--font-data);color:var(--high);font-weight:600;}
.riskbar-wrap{display:flex;align-items:center;gap:var(--sp-3);}
.riskbar{display:flex;width:120px;height:6px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-2);}
.riskbar span{height:100%;}
.riskbar .seg-high{background:var(--high);}
.riskbar .seg-med{background:var(--med);}
.riskbar .seg-low{background:var(--low);}
.riskbar-legend{display:flex;gap:var(--sp-3);font-size:11px;color:var(--text-dim);}
.riskbar-legend b{font-family:var(--font-data);}
.lg-high b{color:var(--high);}
.lg-med b{color:var(--med);}
.lg-low b{color:var(--low);}

/* LAYOUT: map left, cards right */
.app-body{display:flex;height:calc(100vh - 110px);overflow:hidden;}

/* MAP PANEL */
#map-panel{flex:0 0 55%;position:relative;overflow:hidden;}
#map{height:100%;width:100%;background:#0c0e14;}

/* Leaflet dark overrides */
.leaflet-container{background:#0c0e14 !important;font-family:var(--font-ui);}
.leaflet-tile{filter:brightness(.7) saturate(.4) hue-rotate(190deg);}
.leaflet-control-zoom a{background:var(--surface) !important;color:var(--text) !important;border-color:var(--border) !important;}
.leaflet-control-zoom a:hover{background:var(--surface-2) !important;}
.leaflet-control-attribution{background:rgba(12,14,20,.8) !important;color:var(--text-faint) !important;font-size:10px !important;}

/* Custom markers */
.cam-marker{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 10px var(--font-data);border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(0,0,0,.5);}
.cam-marker:hover,.cam-marker.active{transform:scale(1.25);z-index:1000 !important;box-shadow:0 4px 16px rgba(0,0,0,.7);}
.cam-marker.high{background:var(--high);color:#fff;}
.cam-marker.medium{background:var(--med);color:#0c0e14;}
.cam-marker.low{background:var(--low);color:#0c0e14;}

/* Map popup */
.leaflet-popup-content-wrapper{background:var(--surface) !important;border:1px solid var(--border) !important;border-radius:var(--r-md) !important;box-shadow:0 8px 32px rgba(0,0,0,.6) !important;color:var(--text) !important;padding:0 !important;}
.leaflet-popup-content{margin:0 !important;width:240px !important;}
.leaflet-popup-tip-container{display:none;}
.leaflet-popup-close-button{color:var(--text-dim) !important;right:10px !important;top:8px !important;font-size:16px !important;}
.map-popup{padding:14px 16px;}
.mp-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;padding-right:20px;}
.mp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:3px;}
.mp-row b{color:var(--text);}
.mp-pill{display:inline-block;font:700 10px var(--font-ui);letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-sm);margin-top:8px;}
.mp-pill.high{color:var(--high);background:var(--high-soft);}
.mp-pill.medium{color:var(--med);background:var(--med-soft);}
.mp-pill.low{color:var(--low);background:var(--low-soft);}
.mp-btn{display:block;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:7px 0;font:600 11px var(--font-ui);text-align:center;cursor:pointer;width:100%;transition:opacity .15s;}
.mp-btn:hover{opacity:.85;}

/* CARDS PANEL */
#cards-panel{flex:1;overflow-y:auto;background:var(--bg);}
#cards-panel::-webkit-scrollbar{width:4px;}
#cards-panel::-webkit-scrollbar-track{background:transparent;}
#cards-panel::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:2px;}

/* FILTER BAR */
.filterbar{background:var(--surface);border-bottom:1px solid var(--border);padding:var(--sp-2) var(--sp-4);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
.filter-group{display:flex;gap:4px;align-items:center;}
.filter-label{font-size:11px;color:var(--text-faint);font-weight:500;margin-right:2px;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:5px 10px;border-radius:var(--r-sm);cursor:pointer;font:500 11px var(--font-ui);transition:all .15s;}
.filter-btn:hover{border-color:var(--border-2);color:var(--text);}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.filter-btn.active.risk-high{background:var(--high);border-color:var(--high);}
.filter-btn.active.risk-med{background:var(--med);border-color:var(--med);color:#0c0e14;}
.filter-btn.active.risk-low{background:var(--low);border-color:var(--low);color:#0c0e14;}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.results-count{font-size:11px;color:var(--text-faint);font-family:var(--font-data);margin-left:auto;}

/* CARDS */
.cards-grid{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);}
.card{background:var(--surface);border:1px solid var(--border);border-top:2px solid transparent;border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:all .15s;}
.card:hover,.card.highlighted{border-color:var(--border-2);background:var(--surface-2);}
.card.highlighted{border-top-color:var(--accent) !important;box-shadow:0 0 0 1px var(--accent);}
.card.risk-high{border-top-color:var(--high);}
.card.risk-medium{border-top-color:var(--med);}
.card.risk-low{border-top-color:var(--low);}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3);}
.card-title-block{flex:1;min-width:0;}
.card-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-dev{font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.risk-badge{flex-shrink:0;text-align:right;}
.risk-score{font:700 18px var(--font-data);line-height:1;}
.risk-score.high{color:var(--high);}
.risk-score.medium{color:var(--med);}
.risk-score.low{color:var(--low);}
.risk-pill{font:700 9px var(--font-ui);letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-sm);display:inline-block;margin-top:4px;}
.risk-pill.high{color:var(--high);background:var(--high-soft);}
.risk-pill.medium{color:var(--med);background:var(--med-soft);}
.risk-pill.low{color:var(--low);background:var(--low-soft);}

.card-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat-val{font:600 12px var(--font-data);color:var(--text);}
.stat-lbl{font-size:10px;color:var(--text-faint);}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border);}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;}
.tag{font:500 10px var(--font-ui);padding:2px 7px;border-radius:var(--r-pill);border:1px solid var(--border);color:var(--text-faint);}
.tag.cls-prem{border-color:rgba(111,140,255,.3);color:var(--accent);}
.tag.cls-biz{border-color:rgba(235,162,60,.3);color:var(--med);}
.tag.cls-com{border-color:rgba(73,184,133,.3);color:var(--low);}
.card-delay{font:600 11px var(--font-data);color:var(--high);}
.no-results{padding:var(--sp-8) var(--sp-6);text-align:center;color:var(--text-faint);}
.no-results .nr-icon{font-size:32px;margin-bottom:var(--sp-3);}
.no-results p{font-size:13px;}

/* ── FULL CARD MODAL ─────────────────────────────────────── */
.modal-overlay {
  display:none; position:fixed; inset:0; z-index:2000;
  background:rgba(0,0,0,.7); backdrop-filter:blur(4px);
  align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }

.modal {
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; width:520px; max-width:96vw;
  max-height:92vh; overflow-y:auto; position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,.8);
  animation: modalIn .2s ease;
}
@keyframes modalIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

.modal::-webkit-scrollbar { width:4px; }
.modal::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:2px; }

.modal-close {
  position:sticky; top:0; z-index:10; display:flex; justify-content:flex-end;
  padding:10px 14px 0; background:var(--surface);
}
.modal-close-btn {
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-dim); width:28px; height:28px; border-radius:50%;
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  transition:.15s;
}
.modal-close-btn:hover { color:var(--text); border-color:var(--border-2); }

.modal-body { padding:0 20px 24px; }

/* HEADER */
.mc-header { margin-bottom:16px; }
.mc-name { font-size:18px; font-weight:800; color:#fff; line-height:1.2; margin-bottom:4px; }
.mc-dev  { font-size:12px; color:var(--text-dim); }

/* RISK SCORE BAR */
.mc-score-wrap {
  display:flex; align-items:center; gap:14px;
  background:var(--surface-2); border-radius:10px; padding:14px 16px;
  margin-bottom:16px; border:1px solid var(--border);
}
.mc-score-num {
  font:800 36px var(--font-data); line-height:1; flex-shrink:0;
}
.mc-score-num.high { color:var(--high); }
.mc-score-num.medium { color:var(--med); }
.mc-score-num.low { color:var(--low); }
.mc-score-info { flex:1; }
.mc-verdict { font-size:13px; font-weight:700; margin-bottom:3px; }
.mc-verdict.high { color:var(--high); }
.mc-verdict.medium { color:var(--med); }
.mc-verdict.low { color:var(--low); }
.mc-score-bar-wrap { display:flex; gap:3px; margin-top:6px; }
.mc-score-pip { flex:1; height:4px; border-radius:2px; background:var(--border); }
.mc-score-label { font-size:10px; color:var(--text-faint); margin-top:4px; }

/* FREE SIGNALS */
.mc-section { margin-bottom:16px; }
.mc-section-title {
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-faint); margin-bottom:8px;
  display:flex; align-items:center; gap:6px;
}
.mc-section-title::after {
  content:; flex:1; height:1px; background:var(--border);
}

.signals-grid { display:flex; flex-direction:column; gap:6px; }
.signal {
  display:flex; align-items:center; gap:10px;
  padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  font-size:12px;
}
.signal.danger { background:var(--high-soft); border-color:rgba(239,91,78,.2); }
.signal.warn   { background:var(--med-soft);  border-color:rgba(235,162,60,.2); }
.signal.ok     { background:var(--low-soft);  border-color:rgba(73,184,133,.2); }
.signal.neutral{ background:var(--surface-2); }
.signal-icon { font-size:16px; flex-shrink:0; }
.signal-text { flex:1; line-height:1.3; }
.signal-text b { display:block; font-weight:600; color:var(--text); }
.signal-text span { font-size:11px; color:var(--text-dim); }

/* STATS ROW */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.stat-box { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
.stat-box .val { font:600 14px var(--font-data); color:var(--text); }
.stat-box .lbl { font-size:10px; color:var(--text-faint); margin-top:2px; }

/* RATING PILLS */
.rating-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.rating-item { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; flex:1; min-width:0; }
.rating-item .ri-label { font-size:10px; color:var(--text-faint); margin-bottom:4px; }
.rating-item .ri-name  { font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
.rating-item .ri-badge {
  display:inline-block; font:700 11px var(--font-data); padding:2px 8px; border-radius:4px;
}
.ri-badge.good { background:rgba(73,184,133,.15); color:var(--low); }
.ri-badge.mid  { background:rgba(235,162,60,.15); color:var(--med); }
.ri-badge.bad  { background:rgba(239,91,78,.15); color:var(--high); }
.ri-badge.na   { background:var(--border); color:var(--text-faint); }

/* LOCKED SECTION */
.locked-section {
  border:1px dashed var(--border-2); border-radius:12px;
  padding:20px; margin-bottom:16px; position:relative; overflow:hidden;
}
.locked-overlay {
  position:absolute; inset:0; background:rgba(12,14,20,.85);
  backdrop-filter:blur(3px); border-radius:11px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px;
}
.locked-icon { font-size:28px; }
.locked-title { font-size:13px; font-weight:700; color:var(--text); }
.locked-sub   { font-size:11px; color:var(--text-dim); text-align:center; max-width:280px; }

/* PRICING */
.pricing-cards { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.price-card {
  border:1px solid var(--border); border-radius:10px; padding:14px;
  cursor:pointer; transition:all .15s; text-align:center;
  background:var(--surface-2);
}
.price-card:hover { border-color:var(--accent); background:var(--accent-soft); }
.price-card.featured { border-color:var(--accent); background:var(--accent-soft); }
.price-card .pc-price { font:800 22px var(--font-data); color:var(--accent); margin-bottom:4px; }
.price-card .pc-name  { font-size:12px; font-weight:700; color:var(--text); margin-bottom:6px; }
.price-card .pc-items { font-size:10px; color:var(--text-dim); line-height:1.7; text-align:left; }

.buy-btn {
  width:100%; padding:13px; border:none; border-radius:10px; cursor:pointer;
  font:700 13px var(--font-ui); margin-top:4px; transition:all .15s;
}
.buy-btn.primary { background:var(--accent); color:#fff; }
.buy-btn.primary:hover { opacity:.9; }
.buy-btn.secondary { background:var(--surface-2); border:1px solid var(--border); color:var(--text); }
.buy-btn.secondary:hover { border-color:var(--accent); color:var(--accent); }

/* DISTRICT/FLAGS ROW */
.flags-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.flag {
  display:flex; align-items:center; gap:4px; font-size:11px;
  padding:4px 10px; border-radius:var(--r-pill); border:1px solid var(--border);
  color:var(--text-dim);
}
.flag.ok  { border-color:rgba(73,184,133,.3); color:var(--low); }
.flag.bad { border-color:rgba(239,91,78,.3);  color:var(--high); }
.flag.med { border-color:rgba(235,162,60,.3); color:var(--med); }


/* ── MAP / SCATTER TOGGLE ─── */
#map-panel { position: relative; }

.view-toggle {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 1000; display: flex; align-items: center; gap: 0;
  background: rgba(20,24,34,.92); border: 1px solid var(--border-2);
  border-radius: var(--r-pill); backdrop-filter: blur(8px);
  box-shadow: 0 4px 20px rgba(0,0,0,.5); overflow: hidden;
}
.toggle-btn {
  background: transparent; border: none; color: var(--text-dim);
  padding: 8px 18px; font: 600 11px var(--font-ui); cursor: pointer;
  transition: all .2s; display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.toggle-btn.active { background: var(--accent); color: #fff; }
.toggle-btn:not(.active):hover { color: var(--text); }
.toggle-arrow {
  color: var(--text-faint); font-size: 14px; padding: 0 4px;
  pointer-events: none; opacity: .5;
}

/* Scatter panel */
#scatter-panel {
  display: none; position: absolute; inset: 0;
  background: var(--bg); padding: 20px 24px;
  flex-direction: column;
}
#scatter-panel.visible { display: flex; }

.scatter-header {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.scatter-title {
  font-size: 13px; font-weight: 700; color: var(--text);
}
.scatter-sub {
  font-size: 11px; color: var(--text-faint);
}
#scatter-legend {
  display: flex; gap: 14px; margin-bottom: 10px;
}
.scatter-leg {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim);
}
.scatter-dot {
  width: 8px; height: 8px; border-radius: 50%;
}
#scatter { width: 100%; flex: 1; display: block; }

#scatter-tooltip {
  position: fixed; display: none; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border-2);
  border-radius: var(--r-md); padding: 8px 12px;
  font-size: 11px; color: var(--text); z-index: 3000;
  box-shadow: 0 4px 16px rgba(0,0,0,.5); max-width: 220px; line-height: 1.5;
}
#scatter-tooltip b { display: block; font-size: 12px; margin-bottom: 2px; }

.scatter-axis-x {
  text-align: center; font-size: 10px; color: var(--text-faint);
  margin-top: 4px;
}


/* Detail block inside modal */
.detail-block {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px;
}
.detail-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.detail-row:last-child { border-bottom: none; padding-bottom: 0; }
.detail-row:first-child { padding-top: 0; }
.detail-cell {}
.detail-label {
  font-size: 10px; color: var(--text-faint); font-weight: 500;
  letter-spacing: .03em; text-transform: uppercase; margin-bottom: 3px;
}
.detail-val {
  font-size: 13px; color: var(--text); font-weight: 500;
}
.detail-val.mono { font-family: var(--font-data); font-size: 12px; }

/* Section divider */
.section-divider {
  display: flex; align-items: center; gap: 10px; margin: 16px 0 12px;
}
.section-divider::before, .section-divider::after {
  content: ; flex: 1; height: 1px; background: var(--border);
}
.section-divider-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-faint); white-space: nowrap;
}

/* Signal без иконки — тег вместо эмодзи */
.signal { gap: 8px; }


.lang-btn.active { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }

/* ── KILLER FEATURES ── */
.kf-wrap {
  margin-bottom: 16px;
}
.kf-title {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-faint);
  margin-bottom: 8px;
}
.kf-items {
  display: flex; flex-direction: column; gap: 6px;
}
.kf-item {
  display: flex; align-items: stretch; border-radius: 8px;
  overflow: hidden; border: 1px solid var(--border);
}
.kf-item.danger { border-color: rgba(239,91,78,.3); }
.kf-item.warn   { border-color: rgba(235,162,60,.3); }
.kf-item.ok     { border-color: rgba(73,184,133,.2); }

.kf-bar {
  width: 3px; flex-shrink: 0;
}
.kf-item.danger .kf-bar { background: var(--high); }
.kf-item.warn   .kf-bar { background: var(--med); }
.kf-item.ok     .kf-bar { background: var(--low); }

.kf-content {
  padding: 9px 12px; flex: 1; background: var(--surface-2);
}
.kf-label {
  font-size: 10px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; margin-bottom: 2px;
}
.kf-item.danger .kf-label { color: var(--high); }
.kf-item.warn   .kf-label { color: var(--med); }
.kf-item.ok     .kf-label { color: var(--low); }

.kf-value {
  font-size: 13px; font-weight: 700; color: var(--text);
  line-height: 1.3; margin-bottom: 2px;
}
.kf-sub {
  font-size: 10px; color: var(--text-faint); line-height: 1.4;
}
.kf-meta {
  font-size: 10px; color: var(--text-faint);
  padding: 8px 12px; background: var(--surface-2);
  display: flex; align-items: center; border-left: 1px solid var(--border);
  white-space: nowrap;
}
.kf-item.danger .kf-meta { color: var(--high); }
.kf-item.warn   .kf-meta { color: var(--med); }


.sources-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
  align-items: center;
}
.source-tag {
  font: 600 9px var(--font-ui); letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-faint);
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 2px 6px; border-radius: 3px; text-decoration: none;
  transition: color .15s, border-color .15s;
  display: inline-block;
}
.source-tag:hover { color: var(--accent); border-color: var(--accent); }

const MATCHED = DATA.filter(d=>d.matched);
const state = {risk:'all', cls:'all', district:'all'};
let markers = {};
let activeCard = null;
let map;

const DISTRICT_MAP = {
  'Sergeli':'Сергелийский','Chilonzor':'Чиланзарский',
  'Mirzo-Ulugbek':'Мирзо-Улугбекский','Yashnobod':'Яшнабадский',
  'Yunusobod':'Юнусабадский','Olmozor':'Алмазарский',
  'Bektimir':'Бектемирский','Yakkasaroy':'Яккасарайский',
  'Mirabad':'Мирабадский','Uchtepa':'Учтепинский',
  'Shayxontohur':'Шайхантахурский'
};
const VERDICT = {high:'Признаки долгостроя',medium:'Умеренный риск',low:'Объект надёжный'};

function updateStats() {
  const matched = MATCHED;
  const n    = matched.length;
  const all  = DATA.filter(d=>d.lat&&d.lng).length;
  const high = matched.filter(d=>d.risk==='high').length;
  const med  = matched.filter(d=>d.risk==='medium').length;
  const low  = matched.filter(d=>d.risk==='low').length;

  document.getElementById('total-count').textContent = n;
  document.getElementById('build-count').textContent = '540';  // весь рынок Shaffof
  // 47% — весь рынок Ташкента (540 ЖК), честная питч-цифра
  document.getElementById('overdue-count').textContent = '47% (252 из 540)';
  // Рискбар по всему рынку 540 ЖК
  document.getElementById('cnt-high').textContent = '252';
  document.getElementById('cnt-med').textContent  = '10';
  document.getElementById('cnt-low').textContent  = '278';
  document.getElementById('bar-high').style.width = '47%';
  document.getElementById('bar-med').style.width  = '2%';
  document.getElementById('bar-low').style.width  = '51%';
}

function populateDistricts() {
  const sel=document.getElementById('district-filter');
  const dists=[...new Set(MATCHED.map(d=>d.district).filter(Boolean))].sort();
  dists.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=DISTRICT_MAP[d]||d;sel.appendChild(o);});
  sel.addEventListener('change',e=>{state.district=e.target.value;render();});
}

function filtered() {
  return MATCHED.filter(d=>{
    if(state.risk!=='all'&&d.risk!==state.risk) return false;
    if(state.cls!=='all'&&d.housing_class!==state.cls) return false;
    if(state.district!=='all'&&d.district!==state.district) return false;
    return true;
  });
}

function renderCards(items) {
  const grid=document.getElementById('cards-grid');
  document.getElementById('results-count').textContent=T().n_objects(items.length);
  if(!items.length){grid.innerHTML='<div class="no-results"><div class="nr-icon">🔍</div><p>Нет объектов</p></div>';return;}
  grid.innerHTML=items.map(d=>{
    const priceStr=d.price_usd?'$'+d.price_usd.toLocaleString()+'/м²':'—';
    const delayStr=d.delay_days>0?'+'+d.delay_days+' дн':'';
    const clsTag=d.housing_class&&d.housing_class!=='Без класса'?`<span class="tag cls-${d.housing_class==='Премиум'?'prem':d.housing_class==='Бизнес'?'biz':'com'}">${d.housing_class}</span>`:'';
    const distTag=d.district?`<span class="tag">${DISTRICT_MAP[d.district]||d.district}</span>`:'';
    const blocksProg=`${d.blocks_done}/${d.blocks_total} корп.`;
    return `<div class="card risk-${d.risk}" data-id="${d.cam_id}" onclick="selectCard('${d.cam_id}');openModal('${d.cam_id}')">
      <div class="card-header">
        <div class="card-title-block">
          <div class="card-name" title="${d.name}">${d.name}</div>
          <div class="card-dev">${d.dev_comm||d.dev_legal||'—'}</div>
        </div>
        <div class="risk-badge">
          <div class="risk-score ${d.risk}">${Math.round(d.cam_score)}</div>
          <div class="risk-pill ${d.risk}">${VERDICT[d.risk]}</div>
        </div>
      </div>
      <div class="card-stats">
        <div class="stat"><div class="stat-val">${d.apts||'—'}</div><div class="stat-lbl">квартир</div></div>
        <div class="stat"><div class="stat-val">${blocksProg}</div><div class="stat-lbl">сдано корп.</div></div>
        <div class="stat"><div class="stat-val">${priceStr}</div><div class="stat-lbl">цена/м²</div></div>
      </div>
      <div class="card-footer">
        <div class="card-tags">${clsTag}${distTag}${d.has_reestr?'':'<span class="tag" style="border-color:rgba(239,91,78,.3);color:var(--high)">⚠ нет реестра</span>'}</div>
        <div style="display:flex;align-items:center;gap:6px">
          ${d.affil_size>1?`<span style="font-size:10px;color:var(--med)">👥${d.affil_size}</span>`:''}
          ${delayStr?`<span class="card-delay">${delayStr}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join();
}

function renderMap(items) {
  const visIds=new Set(items.map(d=>d.cam_id));
  Object.entries(markers).forEach(([id,{marker,d}])=>{
    const el=marker.getElement();
    if(!el) return;
    if(!d.matched) return; // несматченные всегда видны (серые)
    el.style.display=visIds.has(id)?'':'none';
  });
}

function selectCard(id) {
  if(activeCard!==null){
    const prev=document.querySelector('.card[data-id="'+activeCard+'"]');
    if(prev) prev.classList.remove('highlighted');
    if(markers[activeCard]){const el=markers[activeCard].marker.getElement();if(el)el.classList.remove('active');}
  }
  activeCard=id;
  const card=document.querySelector('.card[data-id="'+id+'"]');
  if(card){card.classList.add('highlighted');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(markers[id]){
    const {marker,d}=markers[id];
    const el=marker.getElement();
    if(el) el.classList.add('active');
    map.flyTo(marker.getLatLng(),15,{duration:.6});
  }
}

function initMap() {
  map=L.map('map',{center:[41.299,69.240],zoom:11,zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(map);

  DATA.forEach(d=>{
    if(!d.lat||!d.lng) return;
    const el=document.createElement('div');
    if(d.matched){
      el.className=`cam-marker ${d.risk}`;
      el.textContent=Math.round(d.cam_score);
    } else {
      el.className='cam-marker grey unmatched-label';
      el.textContent='?';
      el.title=`${d.dev_legal||d.cam_id} — нет данных о продажах`;
    }
    const icon=L.divIcon({html:el.outerHTML,className:'',iconSize:[28,28],iconAnchor:[14,14]});
    const marker=L.marker([d.lat,d.lng],{icon}).addTo(map);
    if(d.matched){
      marker.on('click',()=>{selectCard(d.cam_id);openModal(d.cam_id);});
    } else {
      // Несматченные — только небольшой тултип, без модала
      marker.bindTooltip(`<div style="font-size:11px;padding:4px 8px;background:#1b2029;border:1px solid #262b3a;color:#8a90a8;border-radius:6px">${d.dev_legal||d.cam_id}<br><span style="color:#565c72;font-size:10px">Нет данных о продажах</span></div>`,{direction:'top',offset:[0,-14],opacity:1});
    }
    markers[d.cam_id]={marker,d};
  });
}

document.querySelectorAll('[data-filter]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.filter,v=btn.dataset.val;
    if(f==='risk') state.risk=v;
    if(f==='class') state.cls=v;
    document.querySelectorAll(`[data-filter="${f}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

function render() {
  const items=filtered();
  renderCards(items);
  renderMap(items);
  if (currentView === 'scatter') drawScatter(items);
}

function ratingClass(r) {
  if(!r) return 'na';
  if(['A','B','BB'].includes(r)) return 'good';
  if(['DDD','DD','D'].includes(r)) return 'bad';
  return 'mid';
}
function ratingLabel(r) {
  return {'A':'Высший','B':'Хороший','BB':'Выше среднего','C':'Удовлетворительный','CC':'Ниже среднего','CCC':'Слабый','D':'Плохой','DD':'Очень плохой','DDD':'Критический'}[r]||'нет данных';
}
function scoreColor(risk) {
  return {high:'var(--high)',medium:'var(--med)',low:'var(--low)'}[risk]||'var(--text)';
}

function openModal(id) {
  const d = DATA.find(x=>String(x.cam_id)===String(id));
  if (!d||!d.matched) return;

  const priceStr = d.price_usd ? '$'+d.price_usd.toLocaleString()+'/м²' : 'нет данных';
  const nPips=20, filled=Math.round(d.cam_score/100*nPips);
  const scoreClr = {high:'var(--high)',medium:'var(--med)',low:'var(--low)'}[d.risk];
  const pipsHTML = Array.from({length:nPips},(_,i)=>
    `<div class="mc-score-pip" style="${i<filled?'background:'+scoreClr:''}"></div>`).join();

  const DM={'Sergeli':'Сергелийский','Chilonzor':'Чиланзарский','Mirzo-Ulugbek':'Мирзо-Улугбекский',
    'Yashnobod':'Яшнабадский','Yunusobod':'Юнусабадский','Olmozor':'Алмазарский',
    'Bektimir':'Бектемирский','Yakkasaroy':'Яккасарайский','Mirabad':'Мирабадский',
    'Uchtepa':'Учтепинский','Shayxontohur':'Шайхантахурский'};

  const RN={'A':'Высший','B':'Хороший','BB':'Выше среднего','C':'Удовлетворительный',
    'CC':'Ниже среднего','CCC':'Слабый','D':'Плохой','DD':'Очень плохой','DDD':'Критический'};

  // ── СИГНАЛЫ РИСКА ──
  const signals = [];

  if (d.delay_days > 730)
    signals.push({cls:'danger',tag:T().tag_critical,title:`Просрочка ${d.delay_days} дней (${(d.delay_days/365).toFixed(1)} г.)`,sub:'Объект соответствует критериям долгостроя'});
  else if (d.delay_days > 180)
    signals.push({cls:'danger',tag:T().tag_risk,title:`Просрочка ${d.delay_days} дней`,sub:T().sig_delay_sub_180});
  else if (d.delay_days > 0)
    signals.push({cls:'warn',tag:T().tag_warn,title:`Просрочка ${d.delay_days} дней`,sub:T().kf_delay_sub_sm});
  else
    signals.push({cls:'ok',tag:T().tag_ok,title:'В сроке сдачи',sub:`Дедлайн: ${d.deadline||'не указан'}`});

  if (d.has_reestr)
    signals.push({cls:'ok',tag:T().tag_ok,title:'В реестре Minstroy',sub:T().sig_reestr_ok});
  else
    signals.push({cls:'danger',tag:T().tag_violation,title:'Не зарегистрирован в реестре Minstroy',sub:T().sig_reestr_no});

  if (['DDD','DD'].includes(d.dev_rating))
    signals.push({cls:'danger',tag:T().tag_risk,title:`Рейтинг застройщика: ${d.dev_rating} — ${RN[d.dev_rating]}`,sub:T().sig_rat_sub_bad});
  else if (['A','B','BB'].includes(d.dev_rating))
    signals.push({cls:'ok',tag:T().tag_ok,title:`Рейтинг застройщика: ${d.dev_rating} — ${RN[d.dev_rating]}`,sub:T().sig_rat_sub_ok});
  else if (d.dev_rating)
    signals.push({cls:'warn',tag:T().tag_moderate,title:`Рейтинг застройщика: ${d.dev_rating} — ${RN[d.dev_rating]}`,sub:T().sig_rat_sub_mid});
  else
    signals.push({cls:'neutral',tag:T().tag_nodata,title:'Рейтинг застройщика не найден',sub:T().sig_rat_none});

  if (d.blocks_done === 0 && d.blocks_total > 0)
    signals.push({cls:'danger',tag:T().tag_risk,title:`Корпусов принято: 0 из ${d.blocks_total}`,sub:'Ни один корпус ещё не прошёл приёмку'});
  else if (d.blocks_done > 0 && d.blocks_done < d.blocks_total) {
    const rem = d.blocks_total - d.blocks_done;
    signals.push({cls: d.delay_days>180?'danger':'warn', tag: d.delay_days>180?'РИСК':'ВНИМАНИЕ',
      title:`Корпусов принято: ${d.blocks_done} из ${d.blocks_total} — ещё ${rem} не сдано`,
      sub: d.delay_days>180?`Оставшиеся корпуса опаздывают на ${d.delay_days} дней`:`Ещё ${rem} корп. в процессе строительства`});
  } else if (d.blocks_done === d.blocks_total && d.blocks_total > 0)
    signals.push({cls:'ok',tag:T().tag_ok,title:`Все ${d.blocks_total} корпусов приняты`,sub:'Строительство завершено полностью'});

  if (!d.has_resale)
    signals.push({cls:'warn',tag:T().tag_warn,title:'Нет вторичных продаж',sub:T().sig_resale_no});
  else if (d.blocks_done < d.blocks_total && d.blocks_total > 0)
    signals.push({cls:'warn',tag:T().tag_partial,title:`Вторичка есть, но ${d.blocks_total-d.blocks_done} из ${d.blocks_total} корпусов не сданы`,sub:'Часть покупателей уже получила ключи — остальные ждут задержанных корпусов'});
  else
    signals.push({cls:'ok',tag:T().tag_ok,title:'Есть вторичные продажи',sub:T().sig_resale_ok});

  if (d.affil_size>1) {
    const bp = d.affil_bad_pct;
    if (bp !== null && bp > 50)
      signals.push({cls:'danger',tag:T().tag_risk,
        title:`Аффилиация: группа из ${d.affil_size} компаний (${bp}% с плохим исходом)`,
        sub:'Подробный анализ аффилиационной сети — в полном отчёте'});
    else if (bp !== null)
      signals.push({cls:'warn',tag:T().tag_warn,
        title:`Аффилиация: группа из ${d.affil_size} компаний (${bp}% с плохим исходом)`,
        sub:'Подробный анализ аффилиационной сети — в полном отчёте'});
    else
      signals.push({cls:'warn',tag:T().tag_warn,
        title:`Аффилиация: застройщик входит в группу из ${d.affil_size} компаний`,
        sub:'История группы не пересекается с базой CAM — данных о плохих исходах нет'});
  }

  if (d.has_mortgage)
    signals.push({cls:'ok',tag:T().tag_ok,title:'Ипотека одобрена банками',sub:T().sig_mortgage.split('·')[1]||''});

  // Считаем тревожные сигналы
  const dangerCount = signals.filter(s=>s.cls==='danger').length;
  const warnCount   = signals.filter(s=>s.cls==='warn').length;

  function sigRow(s, blurred) {
    const tagClr = {danger:'var(--high)',warn:'var(--med)',ok:'var(--low)',neutral:'var(--text-faint)'}[s.cls];
    const blur = blurred ? 'filter:blur(4px);user-select:none;pointer-events:none' : '';
    return `<div class="signal ${s.cls}" style="${blur}">
      <div style="flex-shrink:0;width:76px">
        <span style="font:600 9px var(--font-ui);letter-spacing:.06em;color:${tagClr};
          background:${tagClr}1a;padding:2px 6px;border-radius:3px;white-space:nowrap">${s.tag}</span>
      </div>
      <div class="signal-text"><b>${s.title}</b><span>${s.sub}</span></div>

// ── KILLER FEATURES ─────────────────────────────────────────────
function buildKillerFeatures(d) {
  const items = [];

  // 1. ЗАКРЫТАЯ СХЕМА / ХОЛДИНГ — самый важный
  if (d.affil_size > 1) {
    const bp = d.affil_bad_pct;
    const isClosed = bp !== null && bp >= 80;
    const cls = (bp === null || bp > 40) ? 'danger' : 'warn';
    const label = isClosed ? T().kf_closed_scheme : T().kf_affil;

    // Получаем методы — парсим учредителей
    let founders = '';
    if (d.affil_methods) {
      const parts = d.affil_methods.split(';').map(s=>s.trim())
        .filter(s=>s.startsWith('учредитель:'))
        .map(s=>s.replace('учредитель:',).trim().toUpperCase());
      if (parts.length > 0) {
        founders = parts.slice(0,2).join(', ');
        if (parts.length > 2) founders += ` +${parts.length-2}`;
      }
    }

    items.push({
      cls,
      label,
      value: d.affil_bad_pct !== null
        ? `Холдинг из ${d.affil_size} компаний — ${d.affil_bad_pct}% с плохим исходом`
        : `Холдинг из ${d.affil_size} компаний — история не пересекается с базой CAM`,
      sub: founders ? `Учредитель: ${founders}` : 'Связь установлена через orginfo.uz',
      meta: d.affil_bad_pct !== null ? `${d.affil_bad_pct}%` : 'N/A',
    });
  }

  // 2. ПРОСРОЧКА
  if (d.delay_days > 0) {
    const years = (d.delay_days / 365).toFixed(1);
    const cls = d.delay_days > 365 ? 'danger' : d.delay_days > 180 ? 'danger' : 'warn';
    items.push({
      cls,
      label: 'Просрочка',
      value: `+${d.delay_days} дней` + (d.delay_days > 365 ? ` (${years} г.)` : ''),
      sub: d.delay_days > 365 ? 'Соответствует критериям долгостроя'
         : d.delay_days > 180 ? 'Дедлайн нарушен более чем на 6 месяцев'
         : 'Незначительная задержка',
      meta: `${d.blocks_done}/${d.blocks_total} корп.`,
    });
  }

  // 3. РЕЙТИНГ ЗАСТРОЙЩИКА
  if (d.dev_rating) {
    const RN = {'A':'Высший','B':'Хороший','BB':'Выше среднего','C':'Удовлетворительный',
      'CC':'Ниже среднего','CCC':'Слабый','D':'Плохой','DD':'Очень плохой','DDD':'Критический'};
    const cls = ['DDD','DD','D'].includes(d.dev_rating) ? 'danger'
              : ['A','B','BB'].includes(d.dev_rating) ? 'ok' : 'warn';
    if (cls !== 'ok' || items.length < 2) {
      items.push({
        cls,
        label: 'Рейтинг застройщика',
        value: `${d.dev_rating} — ${RN[d.dev_rating]||''}`,
        sub: d.dev_ovrd > 0
          ? `${d.dev_ovrd}% объектов застройщика просрочены`
          : 'По данным reyting.mc.uz',
        meta: d.dev_objs > 0 ? `${d.dev_objs} объектов` : '',
      });
    }
  }

  // 4. КОРПУСА (если критично и ещё нет в топе)
  if (d.blocks_done === 0 && d.blocks_total > 1 && items.length < 3) {
    items.push({
      cls: 'danger',
      label: 'Прогресс строительства',
      value: `0 из ${d.blocks_total} корпусов принято`,
      sub: 'Ни один корпус не прошёл государственную приёмку',
      meta: '0%',
    });
  }

  // Если всё хорошо
  if (items.length === 0) {
    return `<div class="kf-wrap">
      <div style="padding:10px 14px;background:rgba(73,184,133,.06);border:1px solid rgba(73,184,133,.2);
        border-radius:8px;font-size:12px;color:var(--low)">
        Критических факторов риска не обнаружено. Стандартные риски долевого участия.
      </div>
    </div>`;
  }

  const rows = items.slice(0,3).map(item => `
    <div class="kf-item ${item.cls}">
      <div class="kf-bar"></div>
      <div class="kf-content">
        <div class="kf-label">${item.label}</div>
        <div class="kf-value">${item.value}</div>
        ${item.sub ? `<div class="kf-sub">${item.sub}</div>` : ''}
      </div>
      ${item.meta ? `<div class="kf-meta">${item.meta}</div>` : ''}
    </div>`).join();

  return `<div class="kf-wrap">
    <div class="kf-title">Ключевые факторы риска</div>
    <div class="kf-items">${rows}</div>
  </div>`;
}

function buildLikbez(d) {
  const s = T();

  // Recommendations
  document.getElementById('modal-rec-title').textContent = s.rec_title;
  const recs = [];
  if (d.delay_days > 180) recs.push(s.rec_delay);
  if (['DDD','DD','D'].includes(d.dev_rating)) recs.push(s.rec_dev_rating);
  if (d.affil_size > 1) recs.push(s.rec_holding(d.affil_size));
  if (d.blocks_done / Math.max(d.blocks_total,1) < 0.33 && d.blocks_total > 0) recs.push(s.rec_blocks);
  if (recs.length === 0) {
    if (d.risk === 'medium') recs.push(s.rec_medium);
    else recs.push(s.rec_low);
  }
  document.getElementById('modal-recommendations').innerHTML = recs.map(r =>
    `<div style="padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);
      border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
      font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:6px">${r}</div>`
  ).join();

  // Contract
  document.getElementById('modal-contract-title').textContent = s.contract_title;
  document.getElementById('modal-ddu-title').textContent = s.ddu_title;
  document.getElementById('modal-ddu-text').textContent = s.ddu_text;
  document.getElementById('modal-inv-title').textContent = s.inv_title;
  document.getElementById('modal-inv-text').textContent = s.inv_text;

  // Checklist
  document.getElementById('modal-checklist-title').textContent = s.checklist_title;
  document.getElementById('modal-checklist').innerHTML = s.checklist.map(item =>
    `<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 10px;
      background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
      font-size:11px;color:var(--text-dim);line-height:1.5">
      <div style="width:16px;height:16px;border:1px solid var(--border-2);border-radius:3px;
        flex-shrink:0;margin-top:1px"></div>
      <span>${item}</span>
    </div>`
  ).join();
}

function T() { return STRINGS[currentLang] || STRINGS.ru; }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  const s = T();
  // Переводим все статичные элементы
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (s[key] && typeof s[key] === 'string') el.textContent = s[key];
  });
  // Dropdown района
  const sel = document.getElementById('district-filter');
  if (sel && sel.options[0]) sel.options[0].text = s.f_all_districts;
  // Кнопки фильтров
  document.querySelectorAll('[data-filter="risk"]').forEach(b => {
    const v = b.dataset.val;
    if (v==='all') b.textContent = s.f_all;
    if (v==='high') b.textContent = s.f_high;
    if (v==='medium') b.textContent = s.f_med;
    if (v==='low') b.textContent = s.f_low;
  });
  document.querySelectorAll('[data-filter="class"]').forEach(b => {
    const v = b.dataset.val;
    if (v==='all') b.textContent = s.f_all;
    if (v==='Премиум') b.textContent = s.cls_premium;
    if (v==='Бизнес') b.textContent = s.cls_biz;
    if (v==='Комфорт') b.textContent = s.cls_comfort;
  });
  // Перерисовываем карточки с новым языком
  render();
}

// ── VIEW TOGGLE ──────────────────────────────────────────────────
let currentView = 'map';

function switchView(view) {
  currentView = view;
  const mapEl     = document.getElementById('map');
  const scatterEl = document.getElementById('scatter-panel');
  const btnMap    = document.getElementById('btn-map');
  const btnScat   = document.getElementById('btn-scatter');

  if (view === 'map') {
    mapEl.style.display     = 'block';
    scatterEl.classList.remove('visible');
    btnMap.classList.add('active');
    btnScat.classList.remove('active');
    map.invalidateSize();
  } else {
    mapEl.style.display = 'none';
    scatterEl.classList.add('visible');
    btnMap.classList.remove('active');
    btnScat.classList.add('active');
    drawScatter(filtered());
  }
}

// ── SCATTER PLOT ──────────────────────────────────────────────────
function drawScatter(data) {
  const canvas = document.getElementById('scatter');
  if (!canvas) return;

  // Нужно подождать пока панель станет видимой
  requestAnimationFrame(() => {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = canvas.offsetWidth  * dpr;
    canvas.height = canvas.offsetHeight * dpr;
    ctx.scale(dpr, dpr);
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    if (W < 10 || H < 10) return;

    const PAD = {l:44, r:20, t:16, b:36};
    const plotW = W - PAD.l - PAD.r;
    const plotH = H - PAD.t - PAD.b;

    ctx.clearRect(0, 0, W, H);

    // Данные — только сматченные с ценой
    const pts_data = data.filter(d => d.price_usd && d.cam_score && d.matched);
    document.getElementById('scatter-count-label').textContent = pts_data.length + ' объектов с ценой';
    if (!pts_data.length) return;

    const prices = pts_data.map(d => d.price_usd);
    const minP = Math.min(...prices), maxP = Math.max(...prices);

    // Зоны риска (фон)
    const yHigh = PAD.t + plotH * (1 - 65/100);
    const yLow  = PAD.t + plotH * (1 - 35/100);
    ctx.fillStyle = 'rgba(239,91,78,.06)';
    ctx.fillRect(PAD.l, PAD.t, plotW, yHigh - PAD.t);
    ctx.fillStyle = 'rgba(235,162,60,.04)';
    ctx.fillRect(PAD.l, yHigh, plotW, yLow - yHigh);
    ctx.fillStyle = 'rgba(73,184,133,.06)';
    ctx.fillRect(PAD.l, yLow, plotW, H - PAD.b - yLow);

    // Подписи зон
    ctx.font = '9px "IBM Plex Mono"'; ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(239,91,78,.5)';
    ctx.fillText('РИСК', PAD.l - 4, yHigh + 10);
    ctx.fillStyle = 'rgba(73,184,133,.5)';
    ctx.fillText('OK', PAD.l - 4, yLow + 14);

    // Сетка горизонтальная
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = '10px "IBM Plex Mono"'; ctx.textAlign = 'right';
    [0, 25, 50, 75, 100].forEach(pct => {
      const y = PAD.t + plotH * (1 - pct/100);
      ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
      ctx.fillText(pct, PAD.l - 5, y + 3);
    });

    // Сетка вертикальная
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.2)';
    const nTicks = 4;
    for (let i = 0; i <= nTicks; i++) {
      const v = minP + (maxP - minP) * i / nTicks;
      const x = PAD.l + (v - minP) / (maxP - minP || 1) * plotW;
      ctx.beginPath(); ctx.moveTo(x, PAD.t); ctx.lineTo(x, H - PAD.b); ctx.stroke();
      ctx.fillText('$' + Math.round(v).toLocaleString(), x, H - PAD.b + 14);
    }

    // Ось Y подпись
    ctx.save();
    ctx.translate(10, PAD.t + plotH/2);
    ctx.rotate(-Math.PI/2);
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.font = '9px "IBM Plex Mono"';
    ctx.fillText('CAM Score (риск →)', 0, 0);
    ctx.restore();

    // ТОЧКИ
    const colors = {high:'#ef5b4e', medium:'#eba23c', low:'#49b885'};
    window._scatterPts = pts_data.map(d => {
      const x = PAD.l + (d.price_usd - minP) / (maxP - minP || 1) * plotW;
      const y = PAD.t + plotH * (1 - d.cam_score / 100);
      const r = d.cam_id === 'GRP001' ? 8 : 5; // Manhattan крупнее

      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = colors[d.risk] || '#888';
      ctx.globalAlpha = d.cam_id === 'GRP001' ? 1 : .8;
      ctx.fill();
      ctx.globalAlpha = 1;

      // Manhattan — подпись
      if (d.cam_id === 'GRP001') {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = '9px "IBM Plex Mono"'; ctx.textAlign = 'left';
        ctx.fillText('Manhattan', x + 10, y + 3);
      }

      return {x, y, d};
    });
  });
}

// Hover на скаттере
document.addEventListener('DOMContentLoaded', () => {
  const tooltip = document.getElementById('scatter-tooltip');
  const canvas  = document.getElementById('scatter');
  if (!canvas) return;

  canvas.addEventListener('mousemove', e => {
    if (!window._scatterPts) return;
    const rect = canvas.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;
    const mx   = (e.clientX - rect.left);
    const my   = (e.clientY - rect.top);
    const hit  = window._scatterPts.find(p => Math.hypot(p.x - mx, p.y - my) < 10);
    if (hit) {
      canvas.style.cursor = 'pointer';
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
      const VERDICT = {high:'Признаки долгостроя',medium:'Умеренный риск',low:'Объект надёжный'};
      tooltip.innerHTML = `<b>${hit.d.name}</b>${hit.d.dev_comm||hit.d.dev_legal?'<br>'+( hit.d.dev_comm||hit.d.dev_legal):''}<br>CAM Score: ${Math.round(hit.d.cam_score)} — ${VERDICT[hit.d.risk]}<br>Цена: $${hit.d.price_usd.toLocaleString()}/м²${hit.d.delay_days>0?'<br><span style=\'color:var(--high)\'>Просрочка: +'+hit.d.delay_days+' дн</span>':''}`;
    } else {
      canvas.style.cursor = 'default';
      tooltip.style.display = 'none';
    }
  });

  canvas.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  });

  canvas.addEventListener('click', e => {
    if (!window._scatterPts) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const hit = window._scatterPts.find(p => Math.hypot(p.x - mx, p.y - my) < 10);
    if (hit) { selectCard(hit.d.cam_id); openModal(hit.d.cam_id); switchView('map'); }
  });
});
